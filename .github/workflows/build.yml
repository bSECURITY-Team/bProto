name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bootstrap.sh install.sh build_app.sh run.sh
      - run: python3 -m unittest discover -s tests -p test_installers.py -v
      - run: python3 -m unittest discover -s tests -p test_android_release.py -v
      - run: python3 -m unittest discover -s tests -p 'test_connection_*.py' -v
      - run: python3 -m unittest discover -s tests -p test_tls_bridge.py -v
      - name: QUIC integration and coverage
        run: |
          python3 -m venv /tmp/quic-tests
          /tmp/quic-tests/bin/pip install -r tools/quic-bridge/requirements.txt coverage==7.13.1
          /tmp/quic-tests/bin/python -m coverage run --data-file=/tmp/quic-coverage --source=tools/quic-bridge -m unittest discover -s tests -p test_quic_bridge.py -v
          /tmp/quic-tests/bin/python -m coverage report --data-file=/tmp/quic-coverage --fail-under=70
          /tmp/quic-tests/bin/python -m coverage run --data-file=/tmp/agent-coverage --source=tools/config-agent -m unittest discover -s tests -p test_config_agent.py -v
          /tmp/quic-tests/bin/python -m coverage run --append --data-file=/tmp/agent-coverage --source=tools/config-agent -m unittest discover -s tests -p test_users_sync.py -v
          /tmp/quic-tests/bin/python -m coverage report --data-file=/tmp/agent-coverage --fail-under=70
  linux-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            panel/backend -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml
      - run: pnpm --dir panel/frontend install --frozen-lockfile
      - run: ./build_app.sh --check
      - run: python3 tools/connection_lab.py --bin-dir target/release smoke
      - name: Native protocol over TLS HTTP3 and WSS
        run: |
          python3 -m venv /tmp/native-carriers
          /tmp/native-carriers/bin/pip install -r tools/quic-bridge/requirements.txt -r tools/fronting/requirements.txt coverage==7.13.1
          BPROTO_TEST_BIN_DIR=target/release /tmp/native-carriers/bin/python -m coverage run --data-file=/tmp/wss-coverage --source=tools/fronting -m unittest discover -s tests -p test_native_carriers.py -v
          /tmp/native-carriers/bin/python -m coverage report --data-file=/tmp/wss-coverage --fail-under=70
          cargo test --locked -p vpn-core --features ech
          cargo build --locked -p vpn-core --features ech --example h3_bridge
          BPROTO_TEST_BIN_DIR=target/release /tmp/native-carriers/bin/python -m unittest discover -s tests -p test_ech.py -v
      - run: cargo test --locked --manifest-path panel/backend/Cargo.toml
      - run: cargo build --locked --release --manifest-path panel/backend/Cargo.toml
      - name: Panel mTLS create apply revoke with native handshake
        env:
          BPROTO_TEST_BIN_DIR: target/release
          BPROTO_TEST_PANEL_BIN: panel/backend/target/release/panel
        run: python3 -m unittest discover -s tests -p test_key_sync_e2e.py -v
      - name: Credential synchronization over kernel TUN in isolated namespaces
        run: |
          mkdir -p target/lab
          strip --strip-all -o target/lab/vpn-server target/release/vpn-server
          strip --strip-all -o target/lab/bproto target/release/bproto
          strip --strip-all -o target/lab/panel panel/backend/target/release/panel
          chmod 755 target/lab target/lab/vpn-server target/lab/bproto target/lab/panel
          chmod 644 tools/key-sync-lab/runner.py tools/config-agent/agent.py tools/connection_lab.py tests/test_key_sync_e2e.py
          docker compose -p bproto-ci-key-sync -f tools/key-sync-lab/compose.yaml up --build --abort-on-container-exit --exit-code-from server
      - name: Remove private key synchronization lab state
        if: always()
        run: docker compose -p bproto-ci-key-sync -f tools/key-sync-lab/compose.yaml down --volumes
      - name: Package Linux and panel with installation resources
        run: |
          tar -czf bproto-linux-x86_64.tar.gz dist
          sha256sum bproto-linux-x86_64.tar.gz > bproto-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-panel
          path: bproto-linux-x86_64.tar.gz*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use Android SDK supplied by the GitHub runner
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build APK with three native ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build_app.sh --android --no-panel
          gradle -p apps/android testDebugUnitTest
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -s "dist/apk/bproto-$version-debug.apk"
          unzip -l dist/apk/*.apk | grep lib/arm64-v8a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/armeabi-v7a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/x86_64/libbproto.so
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for symbol in connect assignedIp socketFd pump stop close lastError version quicBind quicSocketFd quicStart quicAlive quicClose; do
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "dist/android/jniLibs/$abi/libbproto.so" | grep "Java_dev_bproto_Bproto_$symbol$" > /dev/null
            done
          done
          sha256sum dist/apk/*.apk > dist/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-libraries
          path: dist/android/jniLibs/
          if-no-files-found: error

  android-release-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/download-artifact@v4
        with:
          name: android-native-libraries
          path: apps/android/app/src/main/jniLibs
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Create a short-lived test signer
        run: |
          store="$RUNNER_TEMP/bproto-ephemeral-release.p12"
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          keytool -genkeypair -noprompt -alias bproto-ci-ephemeral -keyalg RSA -keysize 2048 -validity 2 \
            -storetype PKCS12 -keystore "$store" -storepass "$password" -keypass "$password" \
            -dname "CN=bProto ephemeral CI signer"
          printf 'BPROTO_ANDROID_KEYSTORE=%s\n' "$store" >> "$GITHUB_ENV"
          printf 'BPROTO_ANDROID_STORE_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'BPROTO_ANDROID_KEY_ALIAS=bproto-ci-ephemeral\n' >> "$GITHUB_ENV"
          printf 'BPROTO_ANDROID_KEY_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Assemble, test and verify a signed release APK
        run: |
          gradle --no-daemon -p apps/android assembleRelease testReleaseUnitTest
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fingerprint="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1 | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$fingerprint"
          printf 'BPROTO_ANDROID_SIGNER_SHA256=%s\n' "$fingerprint" >> "$GITHUB_ENV"
          python3 tools/android_release.py verify --apksigner "$apksigner" --apk "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep "lib/$abi/libbproto.so"
          done
      - name: Remove ephemeral signer
        if: always()
        run: rm -f "$RUNNER_TEMP/bproto-ephemeral-release.p12"

  android-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/download-artifact@v4
        with:
          name: android-native-libraries
          path: apps/android/app/src/main/jniLibs
      - name: Install release Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Materialize private release keystore
        env:
          BPROTO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: python3 tools/android_release.py keystore "$RUNNER_TEMP/bproto-release.jks"
      - name: Assemble and test signed release
        env:
          BPROTO_ANDROID_KEYSTORE: ${{ runner.temp }}/bproto-release.jks
          BPROTO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          BPROTO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          BPROTO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon -p apps/android assembleRelease testReleaseUnitTest
      - name: Verify signature identity and native libraries
        env:
          BPROTO_ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          python3 tools/android_release.py verify --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --apk "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep "lib/$abi/libbproto.so"
          done
          mkdir -p dist/release-apk
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          cp "$apk" "dist/release-apk/bproto-$version-release.apk"
          sha256sum dist/release-apk/*.apk > dist/release-apk/SHA256SUMS
      - name: Remove private release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bproto-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/release-apk/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-panel, android-release, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-panel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-assets/android
      - name: Package source installation resources and checksums
        run: |
          git archive --format=tar.gz --prefix=bproto-${GITHUB_REF_NAME}/ HEAD > release-assets/bproto-${GITHUB_REF_NAME}-source.tar.gz
          cd release-assets
          rm -f *.sha256 android/SHA256SUMS
          mv android/*.apk .
          sha256sum *.tar.gz *.apk > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.tar.gz release-assets/*.apk release-assets/SHA256SUMS --verify-tag --title "bProto ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
