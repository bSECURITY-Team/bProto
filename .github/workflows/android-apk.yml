name: Android APK (manual)
on:
  workflow_dispatch:
    inputs:
      release:
        description: Also build a signed release APK
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use Android SDK supplied by the GitHub runner
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build APK with three native ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build_app.sh --android --no-panel
          gradle -p apps/android testDebugUnitTest
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -s "dist/apk/bproto-$version-debug.apk"
          unzip -l dist/apk/*.apk | grep lib/arm64-v8a/libbproto.so
          sha256sum dist/apk/*.apk > dist/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-libraries
          path: dist/android/jniLibs/
          if-no-files-found: error

  release:
    if: ${{ inputs.release }}
    needs: [debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/download-artifact@v4
        with:
          name: android-native-libraries
          path: apps/android/app/src/main/jniLibs
      - name: Install release Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Materialize private release keystore
        env:
          BPROTO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: python3 tools/android_release.py keystore "$RUNNER_TEMP/bproto-release.jks"
      - name: Assemble and test signed release
        env:
          BPROTO_ANDROID_KEYSTORE: ${{ runner.temp }}/bproto-release.jks
          BPROTO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          BPROTO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          BPROTO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon -p apps/android assembleRelease testReleaseUnitTest
      - name: Verify signature identity and native libraries
        env:
          BPROTO_ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          python3 tools/android_release.py verify --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --apk "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep "lib/$abi/libbproto.so"
          done
          mkdir -p dist/release-apk
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          cp "$apk" "dist/release-apk/bproto-$version-release.apk"
          sha256sum dist/release-apk/*.apk > dist/release-apk/SHA256SUMS
      - name: Remove private release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bproto-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/release-apk/
          if-no-files-found: error
